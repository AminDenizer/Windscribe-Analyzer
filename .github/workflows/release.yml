name: Multi-Platform Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows Executable
        run: wails build -platform windows/amd64

      - name: Sign Windows Executable (Authenticode)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Windscribe Ultra Tester, O=Open Source Community" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256
          Set-AuthenticodeSignature -FilePath "build/bin/windscribe-ultra-tester.exe" -Certificate $cert -TimestampServer "http://timestamp.digicert.com"

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          mkdir dist-windows
          Copy-Item build/bin/windscribe-ultra-tester.exe dist-windows/
          Copy-Item run_without_smartscreen.bat dist-windows/
          Compress-Archive -Path build/bin/windscribe-ultra-tester.exe, run_without_smartscreen.bat -DestinationPath dist-windows/windscribe-ultra-tester-windows-amd64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-windows/*

  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build macOS Universal App
        run: wails build -platform darwin/universal

      - name: Package macOS Artifact
        run: |
          mkdir dist-macos
          cd build/bin
          zip -r ../../dist-macos/windscribe-ultra-tester-macos-universal.zip windscribe-ultra-tester.app
          cd ../..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist-macos/*

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config build-essential

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Linux Executable
        run: wails build -platform linux/amd64

      - name: Package Linux Artifact
        run: |
          mkdir dist-linux
          cd build/bin
          tar -czvf ../../dist-linux/windscribe-ultra-tester-linux-amd64.tar.gz windscribe-ultra-tester
          cd ../..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-linux/*

  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Windscribe Ultra Analyzer ${{ github.ref_name }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Windscribe Ultra Analyzer (${{ github.ref_name }})

            ### Downloads
            - **Windows (x64)**: `windscribe-ultra-tester.exe` / `windscribe-ultra-tester-windows-amd64.zip`
            - **macOS (Universal - Apple Silicon & Intel)**: `windscribe-ultra-tester-macos-universal.zip` (`.app` bundle)
            - **Linux (x64)**: `windscribe-ultra-tester-linux-amd64.tar.gz`
            - **Checksums**: `checksums.txt` (SHA-256)

            > **Prerequisite**: Install and sign in to the official **Windscribe desktop application / CLI** before running.
